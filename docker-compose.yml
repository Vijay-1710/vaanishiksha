services:
  postgres:
    image: postgres:15
    container_name: eduplat-postgres
    environment:
      POSTGRES_DB: eduplat
      POSTGRES_USER: eduuser
      POSTGRES_PASSWORD: edupass123
    ports:
      # Host port 5433 to avoid conflict with native PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduuser -d eduplat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduplat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
